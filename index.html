<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend><h1>Create your account</h1></legend>
        <div>
            <label for="name">Full name</label>
            <br>
            <input type="text" id="name">
            <br>
            
            <label for="email">Email</label>
            <br>
            <input type="email" id="email">
            <br>
            
            <label for="pass">Password</label>
            <br>
            <input type="password" id="pass">
            <br>
            
            <label for="phone">Phone</label>
            <br>
            <input type="text" id="phone">
            <br>
            <label for="birth">Birth date</label>
            <br>
            <input type="date" id="birth">
            <br>
            <label for="country">Country</label>
            <br>
            <select id="country">
                <option disabled selected hidden>Choose a country</option>
                <option>Jordan</option>
                <option>Syria</option>
                <option>Egypt</option>
                <option>Palestine</option>
            </select>
            <br>
            <label>Preferred contact</label>
            <br>
            <input id="email1" type="radio" name="contact">
            <label for="email1">Email</label>
            <input id="phone1" type="radio" name="contact">
            <label for="phone1">Phone</label>
            <br>
            <input type="checkbox" id="check">
            
            <label for="check"> I accept the terms</label>
            <br>
            <button >Creat account</button>
        </div>
    </fieldset>
</body>
</html>
